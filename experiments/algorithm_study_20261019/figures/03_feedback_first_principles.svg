   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #16324f" x="161.28" y="197.987188" transform="rotate(-0 161.28 197.987188)">1  Current snapshot</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(121.989336 228.851668)">Location + clock</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(86.719102 241.655145)">Remaining rides + visible waits</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #16324f" x="437.76" y="197.987188" transform="rotate(-0 437.76 197.987188)">2  Choose next ride</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(364.440039 228.851668)">Compare remaining-time costs</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(370.075469 241.655145)">Commit only the next action</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #16324f" x="714.24" y="197.987188" transform="rotate(-0 714.24 197.987188)">3  Execute one visit</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(664.773945 228.851668)">Walk → queue → ride</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(652.823984 241.655145)">Time and location change</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #16324f" x="990.72" y="197.987188" transform="rotate(-0 990.72 197.987188)">4  New snapshot</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(907.695938 228.851668)">Observe information now available</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(928.705781 241.655145)">Never read the real future</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #16324f" x="576" y="362.904375" transform="rotate(-0 576 362.904375)">After every completed ride: re-evaluate. Replanning does not require changing the route.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16324f" x="74.88" y="437.4" transform="rotate(-0 74.88 437.4)">EXISTING D0: point-forecast replanning</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(74.88 470.277591)">Forecast complete remaining orders using current information.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(74.88 485.574562)">Choose the lowest predicted total time; preserve the incumbent on ties.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(74.88 500.871534)">Only the next ride is executed before the next replan.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16324f" x="627.84" y="437.4" transform="rotate(-0 627.84 437.4)">ROLLOUT CANDIDATE: explicitly model later decisions</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(627.84 470.277591)">Try each next ride on the same training-day scenarios.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(627.84 485.574562)">Within each scenario, D0 sees only simulated current information.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #5b6874" transform="translate(627.84 500.871534)">Compare mean completion time, including later replanning.</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3078a8" x="57.6" y="34.992" transform="rotate(-0 57.6 34.992)">PARKPLAN-S / FIRST PRINCIPLES</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16324f" x="57.6" y="72.576" transform="rotate(-0 57.6 72.576)">Plan with what is known. Execute one action. Learn again.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6874" x="57.6" y="99.792" transform="rotate(-0 57.6 99.792)">Single objective: minimize total time to finish the same six rides = walking + queueing + service.</text>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16324f" x="57.6" y="576.072" transform="rotate(-0 57.6 576.072)">Research question: does modeling future feedback improve decisions enough to overcome forecast / scenario error?</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6874" x="57.6" y="600.048" transform="rotate(-0 57.6 600.048)">The richer model is a testable hypothesis, not a guarantee. Calibration changes the wait predictor; the shared-order SAA ablation omits adaptive tails.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6874" x="57.6" y="625.32" transform="rotate(-0 57.6 625.32)">Conceptual decision diagram. No numerical result is claimed here. Dataset analyses credit TouringPlans.com; the executor uses synthetic geometry.</text>
  </g>
 </g>
